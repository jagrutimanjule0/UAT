name: Deploy to UAT

on:
  push:
    branches:
      - UAT-Branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SF_CLIENT_ID: ${{ secrets.SF_CONSUMER_KEY }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (required by Salesforce CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli

      - name: Write server.key from GitHub Secret
        run: |
          mkdir -p accesskey
          echo "$SF_JWT_KEY" > accesskey/server.key

      - name: Authenticate to Salesforce org using JWT
        run: |
          sf org login jwt --client-id "$SF_CLIENT_ID" \
            --jwt-key-file accesskey/server.key \
            --username "$SF_USERNAME" \
            --set-default \
            --instance-url https://test.salesforce.com

      - name: Deploy to Salesforce
        run: |
          echo "Deployment started ..."
          sf project deploy start -x manifest/package.xml --target-org default --ignore-warnings --verbose
          echo "Deployment Finished."
